<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Spider doodle">
  <!-- Original fan-style spider doodle (not an official trademark) -->
  <defs>
    <radialGradient id="body" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#b01030"/>
    </radialGradient>
  </defs>
  <!-- web hint -->
  <g stroke="#1e3a8a" stroke-width="1.5" fill="none" opacity="0.35">
    <path d="M64 8 L64 28"/>
    <path d="M64 8 L40 24"/>
    <path d="M64 8 L88 24"/>
    <path d="M40 24 Q64 32 88 24"/>
  </g>
  <!-- legs -->
  <g fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round">
    <path d="M48 58 C28 48 18 36 14 28"/>
    <path d="M46 68 C24 68 14 78 10 90"/>
    <path d="M50 78 C30 92 22 108 20 118"/>
    <path d="M80 58 C100 48 110 36 114 28"/>
    <path d="M82 68 C104 68 114 78 118 90"/>
    <path d="M78 78 C98 92 106 108 108 118"/>
  </g>
  <!-- abdomen -->
  <ellipse cx="64" cy="78" rx="22" ry="26" fill="url(#body)" stroke="#0f172a" stroke-width="3"/>
  <!-- web pattern on back -->
  <g stroke="#fff" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M64 58 L64 98"/>
    <path d="M50 66 L78 90"/>
    <path d="M78 66 L50 90"/>
    <ellipse cx="64" cy="78" rx="10" ry="12"/>
  </g>
  <!-- cephalothorax -->
  <ellipse cx="64" cy="48" rx="16" ry="14" fill="url(#body)" stroke="#0f172a" stroke-width="3"/>
  <!-- eyes -->
  <ellipse cx="58" cy="46" rx="5" ry="6" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
  <ellipse cx="70" cy="46" rx="5" ry="6" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="59" cy="47" r="2.2" fill="#0f172a"/>
  <circle cx="71" cy="47" r="2.2" fill="#0f172a"/>
</svg>
