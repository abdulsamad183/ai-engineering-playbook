{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const path = window.location.pathname;
      const normalized = path.replace(/\/index\.html$/, "/");
      const body = document.body;

      if (normalized === "/" || normalized.endsWith("/ai-engineering-playbook/")) {
        body.dataset.playbookPage = "home";
      }
      if (normalized.endsWith("/handbooks/")) {
        body.dataset.playbookPage = "handbooks";
      }

      const themeMap = [
        { theme: "foundations", match: /python-engineering|python-frameworks-libraries|mathematics-statistics|machine-learning|deep-learning|natural-language-processing/ },
        { theme: "models", match: /transformers|llm-engineering|generative-ai/ },
        { theme: "applications", match: /prompt-engineering|llm-application-development|chatbots|embeddings-vector-databases|rag|llm-fine-tuning|ai-evaluation/ },
        { theme: "agents", match: /ai-agents|agentic-ai|mcp|multi-agent-systems/ },
        { theme: "production", match: /ai-system-design|mlops-llmops|ai-deployment|ai-security-guardrails|advanced-ai-research/ }
      ];

      for (const entry of themeMap) {
        if (entry.match.test(normalized)) {
          body.dataset.sectionTheme = entry.theme;
          break;
        }
      }
    });
  </script>
{% endblock %}

{# Side rails fill wide-screen gutters with spider doodles #}
{% block footer %}
  {{ super() }}
  <aside class="spidey-rails" aria-hidden="true">
    <div class="spidey-rail spidey-rail--left">
      <img class="spidey-deco spidey-deco--corner" src="{{ 'assets/web-corner.svg' | url }}" alt="" />
      <img class="spidey-deco spidey-deco--hang" src="{{ 'assets/spider-doodle-hang.svg' | url }}" alt="" />
      <img class="spidey-deco spidey-deco--main" src="{{ 'assets/spider-doodle.svg' | url }}" alt="" />
      <img class="spidey-deco spidey-deco--blue" src="{{ 'assets/spider-doodle-blue.svg' | url }}" alt="" />
      <div class="spidey-strand spidey-strand--a"></div>
      <div class="spidey-strand spidey-strand--b"></div>
    </div>
    <div class="spidey-rail spidey-rail--right">
      <img class="spidey-deco spidey-deco--corner spidey-deco--flip" src="{{ 'assets/web-corner.svg' | url }}" alt="" />
      <img class="spidey-deco spidey-deco--blue" src="{{ 'assets/spider-doodle-blue.svg' | url }}" alt="" />
      <img class="spidey-deco spidey-deco--hang" src="{{ 'assets/spider-doodle-hang.svg' | url }}" alt="" />
      <img class="spidey-deco spidey-deco--main" src="{{ 'assets/spider-doodle.svg' | url }}" alt="" />
      <div class="spidey-strand spidey-strand--c"></div>
      <div class="spidey-strand spidey-strand--d"></div>
    </div>
  </aside>
{% endblock %}
